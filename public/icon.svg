<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="50%" stop-color="#FCE8ED" />
      <stop offset="100%" stop-color="#F5CAD4" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C384E" />
      <stop offset="50%" stop-color="#C87386" />
      <stop offset="100%" stop-color="#632030" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C87386" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#EAB1BF" stroke-width="4" opacity="0.6" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#D88A9C" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 6" />

  <!-- Central Emblem -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="230" r="130" fill="#FFFDFE" opacity="0.85" />
    <circle cx="256" cy="230" r="122" fill="none" stroke="#F2CBD4" stroke-width="3" />
  </g>

  <!-- Letter E for ELORIA -->
  <text x="256" y="295" font-family="Georgia, serif" font-size="195" font-weight="bold" font-style="italic" fill="url(#gold)" text-anchor="middle">𝑬</text>

  <!-- Sparkle top right of E -->
  <path d="M345 155 Q355 165 365 165 Q355 165 345 175 Q345 165 335 165 Q345 165 345 155 Z" fill="#C87386" />
  <circle cx="170" cy="170" r="4" fill="#D88A9C" opacity="0.8" />

  <!-- Subtitle ELORIA -->
  <text x="256" y="410" font-family="Georgia, serif" font-size="42" font-weight="bold" letter-spacing="6" fill="#5A1C2C" text-anchor="middle">ELORIA</text>
  <text x="256" y="440" font-family="sans-serif" font-size="16" font-weight="500" letter-spacing="4" fill="#8C384E" text-anchor="middle">HAIR • CARE • BEAUTY</text>
</svg>